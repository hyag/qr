<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード生成ツール</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --accent:        #6366f1;
  --accent-strong: #4f46e5;
  --accent-soft:   rgba(99,102,241,.10);
  --bg:            #f8fafc;
  --bg-elevated:   #ffffff;
  --border:        #e2e8f0;
  --text:          #0f172a;
  --text-muted:    #64748b;
  --radius:        14px;
  --shadow:        0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.08);
  --maxw:          540px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent:        #818cf8;
    --accent-strong: #6366f1;
    --accent-soft:   rgba(129,140,248,.12);
    --bg:            #0a0f1e;
    --bg-elevated:   #111827;
    --border:        #1e2d45;
    --text:          #f1f5f9;
    --text-muted:    #94a3b8;
    --shadow:        0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI",
               "Noto Sans JP", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: min(100% - 2.5rem, var(--maxw));
  margin: 0 auto;
  padding: clamp(2rem, 8vw, 4rem) 0;
}

.header { text-align: center; margin-bottom: 2rem; }
.header h1 {
  margin: 0 0 .4rem;
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 700;
  letter-spacing: -.02em;
}
.header p { margin: 0; color: var(--text-muted); font-size: .9rem; }

/* 入力エリア */
.input-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.input-group { display: flex; flex-direction: column; gap: .4rem; }
.input-group label {
  font-size: .82rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.input-group textarea,
.input-group input[type="text"] {
  padding: .75rem 1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
  resize: vertical;
}
.input-group textarea:focus,
.input-group input[type="text"]:focus { border-color: var(--accent); }

.options-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .8rem;
}

.color-group { display: flex; flex-direction: column; gap: .4rem; }
.color-group label {
  font-size: .82rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.color-group input[type="color"] {
  width: 100%;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  cursor: pointer;
  padding: 3px;
}

.size-group { display: flex; flex-direction: column; gap: .4rem; }
.size-group label {
  font-size: .82rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  display: flex;
  justify-content: space-between;
}
.size-group input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

.btn-generate {
  padding: .85rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background .2s;
  width: 100%;
}
.btn-generate:hover { background: var(--accent-strong); }

/* QRコード表示 */
.qr-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: var(--shadow);
  text-align: center;
  display: none;
}
.qr-card.show { display: block; }

#qrcode {
  display: inline-flex;
  padding: 1rem;
  background: #fff;
  border-radius: 12px;
  margin-bottom: 1.2rem;
}
#qrcode canvas,
#qrcode img { display: block; }

.btn-row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
.btn-dl {
  padding: .6rem 1.4rem;
  border-radius: 8px;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: opacity .2s;
  border: none;
}
.btn-dl:hover { opacity: .8; }
.btn-dl.png { background: var(--accent); color: #fff; }
.btn-dl.svg { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }

.qr-text {
  font-size: .78rem;
  color: var(--text-muted);
  word-break: break-all;
  margin-top: .8rem;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>📷 QRコード生成</h1>
    <p>URLやテキストを入力してQRコードを作成できます。</p>
  </div>

  <div class="input-card">
    <div class="input-group">
      <label>URL・テキスト</label>
      <textarea id="textInput" rows="3" placeholder="https://hyag.github.io/"></textarea>
    </div>

    <div class="options-row">
      <div class="color-group">
        <label>前景色</label>
        <input type="color" id="fgColor" value="#000000">
      </div>
      <div class="color-group">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>

    <div class="size-group">
      <label>
        <span>サイズ</span>
        <span id="sizeVal">256px</span>
      </label>
      <input type="range" id="sizeRange" min="128" max="512" step="32" value="256">
    </div>

    <div style="display:flex;gap:.6rem;">
      <button class="btn-generate" id="generateBtn" style="flex:1;">QRコードを生成</button>
      <button class="btn-generate" id="resetBtn" style="background:transparent;border:1px solid var(--border);color:var(--text-muted);flex-shrink:0;width:auto;padding:.85rem 1.2rem;">リセット</button>
    </div>
  </div>

  <div class="qr-card" id="qrCard">
    <div id="qrcode"></div>
    <div class="btn-row">
      <button class="btn-dl png" id="downloadPng">PNG でダウンロード</button>
    </div>
    <p class="qr-text" id="qrText"></p>
  </div>

</div>

<script>
let qr = null;

document.getElementById('sizeRange').addEventListener('input', function() {
  document.getElementById('sizeVal').textContent = this.value + 'px';
});

document.getElementById('generateBtn').addEventListener('click', generate);
document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) generate();
});

function generate() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) return;

  const size = Number(document.getElementById('sizeRange').value);
  const fg = document.getElementById('fgColor').value;
  const bg = document.getElementById('bgColor').value;

  const el = document.getElementById('qrcode');
  el.innerHTML = '';

  qr = new QRCode(el, {
    text,
    width: size,
    height: size,
    colorDark: fg,
    colorLight: bg,
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById('qrText').textContent = text;
  document.getElementById('qrCard').classList.add('show');
}

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('textInput').value = '';
  document.getElementById('fgColor').value = '#000000';
  document.getElementById('bgColor').value = '#ffffff';
  document.getElementById('sizeRange').value = 256;
  document.getElementById('sizeVal').textContent = '256px';
  document.getElementById('qrcode').innerHTML = '';
  document.getElementById('qrCard').classList.remove('show');
  qr = null;
});

document.getElementById('downloadPng').addEventListener('click', () => {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
